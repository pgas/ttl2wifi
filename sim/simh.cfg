; SimH AltairZ80 configuration for RomWBW + TTL2WiFi bridge emulator
; Args: %1=ROM (SBC_simh_dual.rom, see romwbw-simh-acia.patch) %2=HD512 %3=HD1K %4=bridge TCP port

set cpu z80
set cpu noaltairrom
set n8vem enabled

; Line 0: Interactive Console (ports 0x68 Data, 0x6D Status)
set sio tty
set sio port=68/0/00/00/00/F/00/T
set sio port=6D/0/01/00/20/F/00/F

; TTL2WiFi Bridge via M2SIO0 (Motorola 6850 ACIA on ports 0x10 Status/Control, 0x11 Data)
set m2sio0 enable
set m2sio0 noconsole
set m2sio0 dtr
set m2sio0 dcd
set m2sio0 cts
attach -u m2sio0 127.0.0.1:%4;notelnet

; RomWBW ROM image (%1)
echo ROM Image: '%1'
attach n8vem0 %1

; Hard disk images (%2 = HD512, %3 = HD1K)
attach hdsk0 %2
attach hdsk1 %3
set hdsk0 format=HDSK
set hdsk1 format=HDSK
set hdsk0 geom=T:8192/N:256/S:512
set hdsk1 geom=T:8192/N:256/S:512
set hdsk0 wrtenb
set hdsk1 wrtenb

; Timer interrupt, 50Hz
d timd 20
d timh 38
set simh timeron

echo
go

